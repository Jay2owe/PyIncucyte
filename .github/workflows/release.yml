name: Publish Python and Windows release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}
concurrency:
  group: pyincucyte-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify one release set
    runs-on: windows-2025
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Check tag and package version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag and package version disagree." }
      - name: Build release set
        shell: pwsh
        run: |
          python -m pip install -e ".[test,release]"
          python scripts/build_release.py --out "$env:RUNNER_TEMP\pyincucyte-release" --tag $env:GITHUB_REF_NAME
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          python scripts/verify_release.py "$env:RUNNER_TEMP\pyincucyte-release\$version" --tag $env:GITHUB_REF_NAME --commit $env:GITHUB_SHA
      - uses: actions/upload-artifact@v4
        with:
          name: pyincucyte-release-set
          path: ${{ runner.temp }}/pyincucyte-release/*/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    name: Publish matching Python and Windows files
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/PyIncucyte/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pyincucyte-release-set
          path: release
      - name: Verify release identity and hashes
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: python scripts/verify_release.py release --tag "$TAG" --commit "$COMMIT"
      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --draft --title "PyIncucyte ${tag#v}" --notes-file release/RELEASE_NOTES.md
          fi
          gh release upload "$tag" release/*.whl release/*.tar.gz release/release-manifest.json release/SHA256SUMS release/RELEASE_NOTES.md --clobber
          gh release upload "$tag" release/windows/* --clobber
      - name: Verify GitHub release asset hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in release/*.whl release/*.tar.gz release/release-manifest.json release/SHA256SUMS release/RELEASE_NOTES.md release/windows/*; do
            name="${file##*/}"
            local_digest="sha256:$(sha256sum "$file" | cut -d ' ' -f 1)"
            remote_digest=""
            for attempt in 1 2 3 4 5 6; do
              remote_digest="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" | jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest // empty')"
              [ "$remote_digest" = "$local_digest" ] && break
              sleep 5
            done
            test "$remote_digest" = "$local_digest" || { echo "GitHub asset hash mismatch: $name" >&2; exit 1; }
          done
      - name: Publish Python files
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release
          skip-existing: true
      - name: Verify PyPI file hashes
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: python scripts/verify_release.py release --tag "$TAG" --commit "$COMMIT" --pypi
      - name: Publish GitHub release after both channels are staged
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
